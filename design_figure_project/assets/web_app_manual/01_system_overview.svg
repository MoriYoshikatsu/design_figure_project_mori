<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px 'Noto Sans JP', sans-serif; fill: #0f172a; }
      .sub { font: 500 16px 'Noto Sans JP', sans-serif; fill: #334155; }
      .label { font: 700 20px 'Noto Sans JP', sans-serif; fill: #0f172a; }
      .text { font: 500 15px 'Noto Sans JP', sans-serif; fill: #1e293b; }
      .small { font: 500 13px 'Noto Sans JP', sans-serif; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .public { fill: #eff6ff; stroke: #60a5fa; }
      .work { fill: #f0fdf4; stroke: #4ade80; }
      .data { fill: #fff7ed; stroke: #fb923c; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-dasharray: 8 6; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .soft { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrowSoft); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
    <marker id="arrowSoft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>
  <text x="50" y="55" class="title">図1 システム全体概要</text>
  <text x="50" y="85" class="sub">公開側の仕様書作成導線と、/work 配下の業務ページ群、主要データの関係を一枚で整理した図です。</text>

  <rect x="50" y="120" width="520" height="340" class="panel public"/>
  <text x="80" y="160" class="label">公開側導線</text>

  <rect x="85" y="195" width="170" height="72" class="panel"/>
  <text x="170" y="226" text-anchor="middle" class="text">/configurator</text>
  <text x="170" y="247" text-anchor="middle" class="small">仕様入力 / プレビュー / 発行</text>

  <rect x="315" y="195" width="210" height="72" class="panel"/>
  <text x="420" y="226" text-anchor="middle" class="text">/quotes/{id}</text>
  <text x="420" y="247" text-anchor="middle" class="small">公開仕様書・見積の確認</text>

  <rect x="315" y="312" width="210" height="72" class="panel"/>
  <text x="420" y="343" text-anchor="middle" class="text">/quotes/{id}/snapshot.pdf</text>
  <text x="420" y="364" text-anchor="middle" class="small">PDF 出力</text>

  <path d="M255 231 H300" class="arrow"/>
  <path d="M420 267 V297" class="arrow"/>

  <rect x="85" y="312" width="170" height="72" class="panel note"/>
  <text x="170" y="343" text-anchor="middle" class="text">自動保存</text>
  <text x="170" y="364" text-anchor="middle" class="small">/configurator/autosave</text>
  <path d="M170 267 V297" class="soft"/>

  <rect x="610" y="120" width="740" height="340" class="panel work"/>
  <text x="640" y="160" class="label">業務側導線（/work/*）</text>

  <rect x="645" y="195" width="145" height="60" class="panel"/>
  <text x="717" y="229" text-anchor="middle" class="text">アカウント</text>

  <rect x="820" y="195" width="180" height="60" class="panel"/>
  <text x="910" y="229" text-anchor="middle" class="text">パーツ価格マスタ</text>

  <rect x="1030" y="195" width="140" height="60" class="panel"/>
  <text x="1100" y="229" text-anchor="middle" class="text">作業費マスタ</text>

  <rect x="1200" y="195" width="120" height="60" class="panel"/>
  <text x="1260" y="229" text-anchor="middle" class="text">DSL</text>

  <rect x="645" y="300" width="145" height="60" class="panel"/>
  <text x="717" y="334" text-anchor="middle" class="text">仕様書セッション</text>

  <rect x="820" y="300" width="180" height="60" class="panel"/>
  <text x="910" y="334" text-anchor="middle" class="text">仕様書見積</text>

  <rect x="1030" y="300" width="140" height="60" class="panel"/>
  <text x="1100" y="334" text-anchor="middle" class="text">変更申請</text>

  <rect x="1200" y="300" width="120" height="60" class="panel"/>
  <text x="1260" y="334" text-anchor="middle" class="text">監査ログ</text>

  <path d="M717 255 V285" class="soft"/>
  <path d="M910 255 V285" class="soft"/>
  <path d="M1100 255 V285" class="soft"/>
  <path d="M1260 255 V285" class="soft"/>
  <path d="M790 330 H805" class="arrow"/>
  <path d="M1000 330 H1015" class="arrow"/>
  <path d="M1170 330 H1185" class="arrow"/>

  <rect x="50" y="510" width="1300" height="320" class="panel data"/>
  <text x="80" y="550" class="label">主要データとロジック</text>

  <rect x="85" y="590" width="180" height="78" class="panel"/>
  <text x="175" y="622" text-anchor="middle" class="text">accounts / users</text>
  <text x="175" y="644" text-anchor="middle" class="small">権限・アカウント表示名</text>

  <rect x="295" y="590" width="200" height="78" class="panel"/>
  <text x="395" y="622" text-anchor="middle" class="text">parts / price_books</text>
  <text x="395" y="644" text-anchor="middle" class="small">部材・単価・価格表明細</text>

  <rect x="525" y="590" width="220" height="78" class="panel"/>
  <text x="635" y="622" text-anchor="middle" class="text">labor_* / templates</text>
  <text x="635" y="644" text-anchor="middle" class="small">作業費・自動選択ルール・DSL版</text>

  <rect x="775" y="590" width="220" height="78" class="panel"/>
  <text x="885" y="622" text-anchor="middle" class="text">configurator_sessions / quotes</text>
  <text x="885" y="644" text-anchor="middle" class="small">仕様スナップショット・見積本体</text>

  <rect x="1025" y="590" width="280" height="78" class="panel"/>
  <text x="1165" y="622" text-anchor="middle" class="text">change_requests / audit_logs / quote_calc_runs</text>
  <text x="1165" y="644" text-anchor="middle" class="small">承認履歴・監査証跡・計算履歴</text>

  <path d="M175 668 V730 H885 V683" class="soft"/>
  <path d="M395 668 V705 H885 V683" class="soft"/>
  <path d="M635 668 V690 H885 V683" class="soft"/>
  <path d="M1165 668 V705 H885 V683" class="soft"/>

  <rect x="640" y="730" width="490" height="62" class="panel note"/>
  <text x="885" y="757" text-anchor="middle" class="text">QuoteService / QuoteCalculationEngine / PricingService / SvgRenderer / SnapshotPdfService</text>
  <text x="885" y="778" text-anchor="middle" class="small">見積計算、図面プレビュー、PDF 出力を支える主要サービス群</text>
</svg>
