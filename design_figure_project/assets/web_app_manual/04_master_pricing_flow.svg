<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 28px 'Noto Sans JP', sans-serif; fill: #0f172a; }
      .sub { font: 500 16px 'Noto Sans JP', sans-serif; fill: #334155; }
      .label { font: 700 18px 'Noto Sans JP', sans-serif; fill: #0f172a; }
      .text { font: 500 14px 'Noto Sans JP', sans-serif; fill: #1e293b; }
      .small { font: 500 12px 'Noto Sans JP', sans-serif; fill: #475569; }
      .panel { fill: #fff; stroke: #cbd5e1; stroke-width: 2; rx: 18; ry: 18; }
      .left { fill: #eff6ff; stroke: #60a5fa; }
      .center { fill: #fefce8; stroke: #eab308; }
      .right { fill: #ecfdf5; stroke: #22c55e; }
      .arrow { stroke: #475569; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="50" y="55" class="title">図4 マスタと見積計算のつながり</text>
  <text x="50" y="85" class="sub">Part、価格表、作業費、DSL がどのように見積計算とプレビューへ影響するかを示した図です。</text>

  <rect x="70" y="150" width="280" height="120" class="panel left"/>
  <text x="100" y="190" class="label">Part 管理</text>
  <text x="100" y="218" class="text">parts</text>
  <text x="100" y="240" class="small">fiber / tube / sleeve / connector / process など</text>

  <rect x="70" y="330" width="280" height="120" class="panel left"/>
  <text x="100" y="370" class="label">価格表管理</text>
  <text x="100" y="398" class="text">price_books / price_book_items</text>
  <text x="100" y="420" class="small">Part ごとの単価、m単価、式、最小数量</text>

  <rect x="70" y="510" width="280" height="120" class="panel left"/>
  <text x="100" y="550" class="label">作業費管理</text>
  <text x="100" y="578" class="text">labor_* テーブル</text>
  <text x="100" y="600" class="small">工程、要素、時間チャージ、自動選択ルール</text>

  <rect x="450" y="150" width="280" height="120" class="panel center"/>
  <text x="480" y="190" class="label">DSL テンプレート</text>
  <text x="480" y="218" class="text">product_templates / versions</text>
  <text x="480" y="240" class="small">入力欄と derived 値の設計図</text>

  <rect x="450" y="330" width="280" height="120" class="panel center"/>
  <text x="480" y="370" class="label">Configurator</text>
  <text x="480" y="398" class="text">入力値、派生値、BOM</text>
  <text x="480" y="420" class="small">Livewire で仕様を組み立てる</text>

  <rect x="450" y="510" width="280" height="120" class="panel center"/>
  <text x="480" y="550" class="label">見積計算サービス</text>
  <text x="480" y="578" class="text">PricingService / QuoteCalculationEngine</text>
  <text x="480" y="600" class="small">顧客別仕切係数、税率、丸め、現行版履歴</text>

  <rect x="860" y="220" width="440" height="140" class="panel right"/>
  <text x="890" y="260" class="label">仕様書・見積出力</text>
  <text x="890" y="288" class="text">quotes / quote_calc_runs / snapshot JSON</text>
  <text x="890" y="312" class="small">見積詳細、計算履歴、公開ページ、PDF、比較資料へ展開される</text>

  <rect x="860" y="430" width="440" height="140" class="panel right"/>
  <text x="890" y="470" class="label">図面・PDF 表示</text>
  <text x="890" y="498" class="text">SvgRenderer / SnapshotPdfService</text>
  <text x="890" y="522" class="small">プレビュー SVG、公開仕様書、各種 PDF を生成する</text>

  <path d="M350 210 H430" class="arrow"/>
  <path d="M350 390 H430" class="arrow"/>
  <path d="M350 570 H430" class="arrow"/>
  <path d="M590 270 V310" class="arrow"/>
  <path d="M590 450 V490" class="arrow"/>
  <path d="M730 390 H840" class="arrow"/>
  <path d="M730 570 H840 V500" class="arrow"/>

  <rect x="180" y="690" width="1040" height="80" class="panel"/>
  <text x="700" y="725" text-anchor="middle" class="text">要点: 管理マスタを更新すると、その内容は次回の仕様入力・見積計算・PDF 出力に連鎖して反映される。</text>
  <text x="700" y="748" text-anchor="middle" class="small">そのため、Part / 価格表 / 作業費 / DSL は単独の画面ではなく、見積品質を支える一つの系として理解する。</text>
</svg>
